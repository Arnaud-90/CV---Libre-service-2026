<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commande de copeaux</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#eef7ee;
    margin:0;
    padding:20px;
}

.card{
    max-width:600px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    color:#2e7d32;
}

label{
    display:block;
    margin-top:10px;
    font-weight:bold;
}

input, select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    box-sizing:border-box;
    margin-top:5px;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    background:#2e7d32;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

.resume{
    background:#f5f5f5;
    padding:15px;
    border-radius:10px;
    margin-top:20px;
}

.success{
    display:none;
    background:#e8f5e9;
    padding:15px;
    border-radius:10px;
    margin-top:20px;
    color:#2e7d32;
}
</style>
</head>

<body>

<div class="card">

<h1>🪵 Vente de copeaux Thermobois</h1>

<h3>Informations client</h3>

<label>Nom</label>
<input type="text" id="nom">

<label>Prénom</label>
<input type="text" id="prenom">

<label>Téléphone</label>
<input type="tel" id="telephone">

<label>Email</label>
<input type="email" id="email">

<label>Adresse</label>
<input type="text" id="adresse">

<label>NPA</label>
<input type="text" id="npa">

<label>Localité</label>
<input type="text" id="localite">

<h3>Produit</h3>

<label>Type de produit</label>
<select id="produit" onchange="calculer()">
    <option value="crible">Copeaux criblés</option>
    <option value="noncrible">Copeaux non criblés</option>
    <option value="trifin">Tri fin (100 litres)</option>
</select>

<label>Quantité</label>
<input type="number" id="quantite" value="1" min="1" onchange="calculer()">

<label>
<input type="checkbox" id="trax" onchange="calculer()">
 Chargement au trax (+ CHF 30)
</label>

<div class="resume">
    <strong>Numéro de commande :</strong>
    <span id="commande"></span>
    <br><br>

    Prix : CHF <span id="prix">0</span>
    <br>

    Chargement : CHF <span id="prixTrax">0</span>
    <br><br>

    <strong>Total : CHF <span id="total">0</span></strong>
</div>

<button onclick="payer()">
Payer (simulation)
</button>

<div class="success" id="success">
    ✅ Paiement accepté<br><br>

    Merci pour votre commande.<br>
    Numéro : <span id="commandeConfirm"></span>
</div>

</div>

<script>

function numeroCommande() {
    const n = Math.floor(Math.random()*9000)+1000;
    return "TB-2026-" + n;
}

document.getElementById("commande").innerText = numeroCommande();

function prixCrible(volume){

    if(volume < 0.5) return 100;
    if(volume < 3) return 70;
    if(volume < 10) return 60;
    if(volume < 20) return 56;
    if(volume < 30) return 48;
    return 42;
}

function prixNonCrible(volume){

    if(volume < 0.5) return 80;
    if(volume < 3) return 55;
    if(volume < 10) return 48;
    if(volume < 20) return 43;
    if(volume < 30) return 39;
    return 37;
}

function calculer(){

    let produit = document.getElementById("produit").value;
    let qte = parseFloat(document.getElementById("quantite").value) || 0;

    let montant = 0;

    if(produit === "crible"){
        montant = qte * prixCrible(qte);
    }

    if(produit === "noncrible"){
        montant = qte * prixNonCrible(qte);
    }

    if(produit === "trifin"){
        montant = qte * 10;
    }

    let trax = document.getElementById("trax").checked ? 30 : 0;

    document.getElementById("prix").innerText = montant.toFixed(2);
    document.getElementById("prixTrax").innerText = trax.toFixed(2);
    document.getElementById("total").innerText = (montant + trax).toFixed(2);
}

function payer(){

    document.getElementById("commandeConfirm").innerText =
    document.getElementById("commande").innerText;

    document.getElementById("success").style.display = "block";
}

calculer();

</script>

</body>
</html>
